name: 功能建议
description: 建议新能力或改进（尤其欢迎新的 Agent 接入）
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 什么场景下现有行为不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、配置或接口。若为新 Agent 接入，请说明宿主是否提供阻塞 Hook/插件扩展点。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 影响
      description: 是否会影响默认放行、fail-open、一次重写等核心原则？
