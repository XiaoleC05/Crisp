name: Bug 报告
description: 报告 Crisp 的错误行为（非安全问题）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请**不要**用公开 issue 报告，按 SECURITY.md 私下反馈。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令、输入（注意移除隐私/密钥）、实际输出。
      placeholder: |
        1. go build -o bin/crisp.exe ./cmd/crisp
        2. echo '{...}' | .\bin\crisp.exe
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: crisp version、Go/Node 版本、宿主 Agent 及其版本（Codex/Claude/DSH/opencode）
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 相关模块
      options:
        - Codex CLI Stop Hook
        - Claude Code Stop Hook
        - DeepSeek Harness 插件
        - opencode 插件
        - check-file / check-text
        - 规则层（checker）
        - Critic 客户端
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（已脱敏）
      description: stderr 结构化 JSON / 插件 JSONL；不要粘贴完整回答、用户隐私或 API Key。
      render: text
